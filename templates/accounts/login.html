{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - WireGuard Manager{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow" style="width: 420px;">

        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock" style="font-size: 3rem; color: #1a1a2e;"></i>
                <h4 class="mt-2 fw-bold">WireGuard Manager</h4>
                <p class="text-muted small">Sign in to manage your VPN</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-dark w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
