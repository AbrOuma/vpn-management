# ============================================================
# WireGuard Peers — Managed by wireguard-manager
# ============================================================

{% for entry in devices_with_psk %}
# {{ entry.device.name }}{% if entry.device.user %} — {{ entry.device.user.full_name }}{% endif %}
[Peer]
PublicKey = {{ entry.device.public_key }}
{% if entry.psk %}PresharedKey = {{ entry.psk }}
{% endif %}AllowedIPs = {{ entry.device.ip_address }}/32
PersistentKeepalive = 25

{% endfor %}