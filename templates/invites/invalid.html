{% extends 'base.html' %}

{% block title %}Link Invalid — WireGuard VPN{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <i class="bi bi-exclamation-triangle"
           style="font-size: 3rem; color: #dc3545;"></i>
        <h4 class="fw-bold mt-3">This link is no longer valid</h4>
        <p class="text-muted">
            {{ reason }}
        </p>
        <p class="text-muted small">
            Contact your network administrator to get a new invite link.
        </p>
    </div>
</div>
{% endblock %}
