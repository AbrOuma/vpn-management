<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WireGuard Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #1a1a2e; }
        .sidebar a { color: #a0a0b0; text-decoration: none; display: block; padding: 10px 20px; border-radius: 6px; margin: 2px 0; }
        .sidebar a:hover, .sidebar a.active { background-color: #16213e; color: #ffffff; }
        .sidebar .brand { color: #ffffff; font-size: 1.2rem; font-weight: 700; padding: 20px; border-bottom: 1px solid #2a2a4a; margin-bottom: 10px; }
        .main-content { padding: 30px; }
        .status-online  { color: #28a745; }
        .status-offline { color: #6c757d; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
