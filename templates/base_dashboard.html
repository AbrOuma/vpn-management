{% extends 'base.html' %}

{% block content %}
<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar p-2" style="width: 240px; min-width: 240px;">
        <div class="brand">
            <i class="bi bi-shield-lock"></i> WG Manager
        </div>

        <a href="{% url 'devices:list' %}"
           class="{% if request.resolver_match.app_name == 'devices' %}active{% endif %}">
            <i class="bi bi-laptop me-2"></i> Devices
        </a>

        <a href="{% url 'users:list' %}"
           class="{% if request.resolver_match.app_name == 'users' and request.resolver_match.url_name != 'departments' and request.resolver_match.url_name != 'department_add' and request.resolver_match.url_name != 'department_delete' %}active{% endif %}">
            <i class="bi bi-people me-2"></i> Users
        </a>

        <a href="{% url 'users:departments' %}"
           class="{% if request.resolver_match.url_name == 'departments' %}active{% endif %}">
            <i class="bi bi-diagram-3 me-2"></i> Departments
        </a>

        <a href="{% url 'server:list' %}"
           class="{% if request.resolver_match.app_name == 'server' %}active{% endif %}">
            <i class="bi bi-server me-2"></i> Servers
        </a>

        <hr style="border-color: #2a2a4a;">

        <a href="/portal/" target="_blank">
            <i class="bi bi-box-arrow-up-right me-2"></i> Portal
        </a>

        <a href="{% url 'accounts:logout' %}">
            <i class="bi bi-box-arrow-left me-2"></i> Logout
        </a>
    </div>

    <!-- Page content -->
    <div class="flex-grow-1 main-content">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block dashboard_content %}{% endblock %}

    </div>
</div>
{% endblock %}
